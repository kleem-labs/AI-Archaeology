name: Deploy the Mathematical Mandala

on:
  push:
    branches:
      - main
    paths:
      - "math-mandala/**"
      - ".github/workflows/deploy-math-mandala.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mathematical-mandala-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the mandala
        uses: actions/upload-pages-artifact@v4
        with:
          path: math-mandala

      - name: Publish the mandala
        id: deployment
        uses: actions/deploy-pages@v4
