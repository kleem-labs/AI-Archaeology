name: Deploy the AI Archaeology Book and Memory Palaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ai-archaeology-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build the book, mandala, and memory palaces
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload the complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Publish the complete site
        id: deployment
        uses: actions/deploy-pages@v4
